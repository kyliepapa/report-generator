<div id="dnd-toolbar">
    <span class="toolbar-label">Layout</span>
    <button id="edit-mode-btn">✏️ Edit Photos</button>
    <button id="undo-btn" disabled>↩ Undo</button>
    <button id="reset-btn" disabled>⟳ Reset</button>
    <span id="edit-count-badge"></span>
    <button id="show-zones-btn" title="Inject empty drop targets into sections that are missing UNTAGGED / BEFORE / AFTER zones">＋ Show Empty Zones</button>
    <button id="inject-heading-btn" title="Insert a heading after the selected photo (subcontracted measures)" style="display:none;">＋ Inject Heading</button>
    <button type="button" id="toolbar-options-toggle" class="toolbar-options-toggle" aria-expanded="false" aria-controls="toolbar-options-panel" title="More layout options">▾ Options</button>
    <span id="edit-mode-hint">Enable to rearrange photos</span>
    <div id="toolbar-options-panel" class="toolbar-options-panel" hidden>
        <label class="toolbar-option-row">
            <input type="checkbox" id="show-tags-toggle" />
            <span>Show Tags</span>
        </label>
    </div>
</div>
