<div class="lightbox-overlay" id="lightbox" onclick="closeLightbox(event)">
    <div class="lightbox-panel" onclick="event.stopPropagation()">
        <button type="button" class="lightbox-close" id="lightbox-close-btn" aria-label="Close">&#x2715;</button>
        <div class="lightbox-main">
            <div class="lightbox-img-stage" id="lightbox-img-stage">
                <div class="lightbox-img-wrap" id="lightbox-img-wrap">
                    <img id="lightbox-img" src="" alt="Photo">
                    <div class="lightbox-crop-overlay" id="lightbox-crop-overlay" hidden>
                        <div class="lightbox-crop-shade lightbox-crop-shade-top"></div>
                        <div class="lightbox-crop-shade lightbox-crop-shade-right"></div>
                        <div class="lightbox-crop-shade lightbox-crop-shade-bottom"></div>
                        <div class="lightbox-crop-shade lightbox-crop-shade-left"></div>
                        <div class="lightbox-crop-box" id="lightbox-crop-box">
                            <span class="lightbox-crop-handle nw"></span>
                            <span class="lightbox-crop-handle ne"></span>
                            <span class="lightbox-crop-handle sw"></span>
                            <span class="lightbox-crop-handle se"></span>
                            <span class="lightbox-crop-handle n"></span>
                            <span class="lightbox-crop-handle s"></span>
                            <span class="lightbox-crop-handle e"></span>
                            <span class="lightbox-crop-handle w"></span>
                        </div>
                    </div>
                </div>
                <div class="lightbox-crop-bar" id="lightbox-crop-bar" hidden>
                    <button type="button" class="lightbox-btn lightbox-btn-sm" id="lightbox-crop-apply">Apply crop</button>
                    <button type="button" class="lightbox-btn lightbox-btn-sm lightbox-btn-ghost" id="lightbox-crop-cancel">Cancel</button>
                    <button type="button" class="lightbox-btn lightbox-btn-sm lightbox-btn-ghost" id="lightbox-crop-reset">Reset crop</button>
                </div>
            </div>
            <div class="lightbox-sidebar">
                <div class="lightbox-info-row">
                    <span class="lightbox-info-label">Timestamp</span>
                    <span class="lightbox-info-value" id="lightbox-ts">—</span>
                </div>
                <div class="lightbox-info-row">
                    <span class="lightbox-info-label">Location</span>
                    <span class="lightbox-info-value" id="lightbox-geo">—</span>
                </div>
                <div class="lightbox-info-row">
                    <span class="lightbox-info-label">Tags</span>
                    <div class="lightbox-tags-edit" id="lightbox-tags-edit">
                        <div class="lightbox-tags" id="lightbox-tags"></div>
                        <input type="text" class="lightbox-tag-input" id="lightbox-tag-input" placeholder="Add tag, press Enter">
                    </div>
                </div>
                <div class="lightbox-actions">
                    <a id="lightbox-open-link" class="lightbox-btn" href="#" target="_blank" rel="noopener">&#128279; Open Photo Link</a>
                    <button type="button" class="lightbox-btn" id="lightbox-rotate-btn">&#8635; Rotate</button>
                    <button type="button" class="lightbox-btn" id="lightbox-crop-btn">&#9986; Crop</button>
                    <button type="button" class="lightbox-btn lightbox-btn-flag" id="lightbox-flag-btn">&#128681; Flag for PDF Hide</button>
                    <a id="lightbox-dl" class="lightbox-btn lightbox-btn-dl" href="" download target="_blank">&#11015; Download Image</a>
                </div>
            </div>
        </div>
    </div>
</div>
